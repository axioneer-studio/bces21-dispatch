services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      APP_NAME: "BCES Dispatch API"
      APP_VERSION: "0.1.0"
      DEBUG: "false"
      APP_TIMEZONE: "Europe/Paris"

      # Database
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the Coolify environment}

      # Coolify provides public URLs without exposing the internal container ports.
      SERVICE_URL_BACKEND: /
      FRONTEND_BASE_URL: ${SERVICE_URL_FRONTEND}
      CORS_ALLOW_ORIGINS: ${SERVICE_URL_FRONTEND}

      # Discord OAuth2
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in the Coolify environment}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in the Coolify environment}
      DISCORD_REDIRECT_URI: ${SERVICE_URL_BACKEND}/api/auth/discord/callback
      DISCORD_SCOPES: "identify"

      # Sessions
      SERVICE_REALBASE64_64_SESSION: /
      SESSION_SECRET: ${SERVICE_REALBASE64_64_SESSION}
      SESSION_COOKIE_NAME: "bces_session"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_DOMAIN: ".${SERVICE_FQDN_FRONTEND}"
      SESSION_TTL_SECONDS: "1209600"

      # Profile management
      PROFILE_DEADLINE_SECONDS: "86400"
      CLEANUP_INTERVAL_SECONDS: "1800"

      # Google Sheets : stockage S3 des credentials du compte de service + chiffrement
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in the Coolify environment}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in the Coolify environment}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the Coolify environment}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the Coolify environment}
      # Clé Fernet (base64, 32 octets) auto-générée par Coolify à la création du projet.
      SERVICE_REALBASE64_64_GOOGLE_SA_KEY: /
      GOOGLE_SA_ENCRYPTION_KEY: ${SERVICE_REALBASE64_64_GOOGLE_SA_KEY}
      STATUS_SYNC_INTERVAL_SECONDS: "10"
    expose:
      - "8000"
    volumes:
      - dispatch-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_BASE: http://backend:8000
    restart: unless-stopped

    environment:
      SERVICE_URL_FRONTEND: /
      NUXT_PUBLIC_API_BASE: ${SERVICE_URL_BACKEND}
      NUXT_PUBLIC_DISCORD_AUTH_URL: ${SERVICE_URL_BACKEND}/api/auth/discord/start
      NUXT_PUBLIC_TIMEZONE: "Europe/Paris"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  dispatch-data:
